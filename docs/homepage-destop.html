ore about form element labels](https://dequeuniversity.com/rules/axe/4.13/label).","score":null,"scoreDisplayMode":"notApplicable"},"landmark-one-main":{"id":"landmark-one-main","title":"Document has a main landmark.","description":"One main landmark helps screen reader users navigate a web page. [Learn more about landmarks](https://dequeuniversity.com/rules/axe/4.13/landmark-one-main).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Failing Elements"}],"items":[]}},"link-name":{"id":"link-name","title":"Links have a discernible name","description":"Link text (and alternate text for images, when used as links) that is discernible, unique, and focusable improves the navigation experience for screen reader users. [Learn how to make links accessible](https://dequeuniversity.com/rules/axe/4.13/link-name).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Failing Elements"}],"items":[]}},"link-in-text-block":{"id":"link-in-text-block","title":"Links are distinguishable without relying on color.","description":"Low-contrast text is difficult or impossible for many users to read. Link text that is discernible improves the experience for users with low vision. [Learn how to make links distinguishable](https://dequeuniversity.com/rules/axe/4.13/link-in-text-block).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Failing Elements"}],"items":[]}},"list":{"id":"list","title":"Lists contain only `\u003cli>` elements and script supporting elements (`\u003cscript>` and `\u003ctemplate>`).","description":"Screen readers have a specific way of announcing lists. Ensuring proper list structure aids screen reader output. [Learn more about proper list structure](https://dequeuniversity.com/rules/axe/4.13/list).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Failing Elements"}],"items":[]}},"listitem":{"id":"listitem","title":"List items (`\u003cli>`) are contained within `\u003cul>`, `\u003col>` or `\u003cmenu>` parent elements","description":"Screen readers require list items (`\u003cli>`) to be contained within a parent `\u003cul>`, `\u003col>` or `\u003cmenu>` to be announced properly. [Learn more about proper list structure](https://dequeuniversity.com/rules/axe/4.13/listitem).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Failing Elements"}],"items":[]}},"meta-refresh":{"id":"meta-refresh","title":"The document does not use `\u003cmeta http-equiv=\"refresh\">`","description":"Users do not expect a page to refresh automatically, and doing so will move focus back to the top of the page. This may create a frustrating or confusing experience. [Learn more about the refresh meta tag](https://dequeuniversity.com/rules/axe/4.13/meta-refresh).","score":null,"scoreDisplayMode":"notApplicable"},"meta-viewport":{"id":"meta-viewport","title":"`[user-scalable=\"no\"]` is not used in the `\u003cmeta name=\"viewport\">` element and the `[maximum-scale]` attribute is not less than 5.","description":"Disabling zooming is problematic for users with low vision who rely on screen magnification to properly see the contents of a web page. [Learn more about the viewport meta tag](https://dequeuniversity.com/rules/axe/4.13/meta-viewport).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Failing Element mages":"Upload images directly through the [media library](https://wordpress.org/support/article/media-library-screen/) to ensure that the required image sizes are available, and then insert them from the media library or use the image widget to ensure the optimal image sizes are used (including those for the responsive breakpoints). Avoid using `Full Size` images unless the dimensions are adequate for their usage. [Learn More](https://wordpress.org/support/article/inserting-images-into-posts-and-pages/).","server-response-time":"Choose a lightweight theme (ideally a block theme) and implement full-page caching or a static site solution. Disable unnecessary plugins to minimize server overhead. Consider upgrading your hosting to managed or dedicated service."}}],"entities":[{"name":"github.dev","origins":["https://automatic-tribble-p79jqj597v69f6x9x-8080.app.github.dev"],"isFirstParty":true,"isUnrecognized":true},{"name":"WordPress","homepage":"https://wp.com/","origins":["https://s.w.org"],"category":"hosting"}],"fullPageScreenshot":{"screenshot":{"data":"data:image/webp;base64,UklGRm6rAABXRUJQVlA4IGKrAAAQ/QOdASo1A1YJPxGIvVksKTSqIZMpEpAiCWlu/CX54RsHeokXeIEfp+/76gtvzzuG67erf0WXrN/8zJevJf+i/u3r58EPzf92/zf69/v37Z+T34x/CfvF8DP1x/0f5TxneofzX/p/1vqn/Mfv3/V/xP7//835l/vf/G/yXiv8pv+H/MewR7b/+f+A8lX7Pd0dv/+8/Z72BfeP75+z/oxe//+X/E/5H2J/TP8X/5/8T8AP9B/w/pf/0PCE/Df8f9xPgE/n/+P/+3+b/2Xw4/4n/8/4XoM+vfYU/Zf/+f7f29f//7rvz////xcB+HTBHkSU0neQ6YI8iSmk7yHTBHkSU0neQ6YI8iSmk7yHTBHkSU0neQ6YI8iSmk7yHaIA/dDckUc3XRkz0vYMB7tgPyqEGar+Ild+iZ48om3h3YxTcDKdZDVALrt8rhOD6tMDo3Ue0B5P+ng4Zrz/pEQ0fHChyDa6y+ic8OvWG8CgI331AykXTrNWuVdE2DtKt2Me8Y/TMmunwIEL/wSUFVbJM0+tKakPce8mFS3nkH7hKGVdeJjx+nOP7Hii3ijtKs6OJQkrV16XOROXQh+hAxAmgyvQljD6+GN7I2L0oc/AcSGm9GY3pKPbUYcB8RD6KPnjsahOx8v3sEUYxYDMXDoEpFiJ7DTQg7QMEX2fHPnQ4QH11E0XxyYGeoKFSBUmOIvogxqffjSd5DphW872+8TMS27yc6dpFYvgGuVRrYxhU1EA2N2jyJsH97yHTBHkSU0neQ6YJBVFUSE8AoZ/h5GX0sRsHli7+7QR+liNg8sXf3aCP0sRsHlidEJR3TF5SO0EfpYjYPLF392gj9LEbB5Yu/u0EfpYjYN51ZHOTGk7yHTBHkSU0
