ve content for audio and video. This may improve the experience for users with hearing or vision impairments."},"a11y-tables-lists":{"title":"Tables and lists","description":"These are opportunities to improve the experience of reading tabular or list data using assistive technology, like a screen reader."},"seo-mobile":{"title":"Mobile Friendly","description":"Make sure your pages are mobile friendly so users don’t have to pinch or zoom in order to read the content pages. [Learn how to make pages mobile-friendly](https://developers.google.com/search/mobile-sites/)."},"seo-content":{"title":"Content Best Practices","description":"Format your HTML in a way that enables crawlers to better understand your app’s content."},"seo-crawl":{"title":"Crawling and Indexing","description":"To appear in search results, crawlers need access to your app."},"best-practices-trust-safety":{"title":"Trust and Safety"},"best-practices-ux":{"title":"User Experience"},"best-practices-browser-compat":{"title":"Browser Compatibility"},"best-practices-general":{"title":"General"},"webmcp":{"title":"WebMCP","description":"Audits validating WebMCP integration."},"agent-accessibility":{"title":"Agent Accessibility","description":"These audits highlight best practices for improving the accessibility of the website for AI agents."},"agent-discoverability":{"title":"Agent Discoverability","description":"These audits validate that websites expose discoverable resources, documentation, and catalogs for AI agents."},"hidden":{"title":""}},"stackPacks":[{"id":"wordpress","title":"WordPress","iconDataURL":"data:image/svg+xml,\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 122.5 122.5\">\u003cg fill=\"%232f3439\">\u003cpath d=\"M8.7 61.3c0 20.8 12.1 38.7 29.6 47.3l-25-68.7c-3 6.5-4.6 13.7-4.6 21.4zm88-2.7c0-6.5-2.3-11-4.3-14.5-2.7-4.3-5.2-8-5.2-12.3 0-4.8 3.7-9.3 8.9-9.3h.7a52.4 52.4 0 0 0-79.4 9.9h3.3c5.5 0 14-.6 14-.6 2.9-.2 3.2 4 .4 4.3 0 0-2.9.4-6 .5l19.1 57L59.7 59l-8.2-22.5c-2.8-.1-5 pt/). Beware that optimizations provided by these plugins may break features of your theme or plugins, so you will likely need to make code changes.","unminified-css":"A number of [WordPress plugins](https://wordpress.org/plugins/search/minify+css/) can speed up your site by concatenating, minifying, and compressing your styles. You may also want to use a build process to do this minification up-front if possible.","unminified-javascript":"A number of [WordPress plugins](https://wordpress.org/plugins/search/minify+javascript/) can speed up your site by concatenating, minifying, and compressing your scripts. You may also want to use a build process to do this minification up front if possible.","efficient-animated-content":"Consider uploading your GIF to a service which will make it available to embed as an HTML5 video.","unused-javascript":"Consider reducing, or switching, the number of [WordPress plugins](https://wordpress.org/plugins/) loading unused JavaScript in your page. To identify plugins that are adding extraneous JS, try running [code coverage](https://developer.chrome.com/docs/devtools/coverage/) in Chrome DevTools. You can identify the theme/plugin responsible from the URL of the script. Look out for plugins that have many scripts in the list which have a lot of red in code coverage. A plugin should only enqueue a script if it is actually used on the page.","uses-long-cache-ttl":"Read about [Browser Caching in WordPress](https://wordpress.org/support/article/optimization/#browser-caching).","uses-optimized-images":"Consider using an [image optimization WordPress plugin](https://wordpress.org/plugins/search/optimize+images/) that compresses your images while retaining quality.","uses-text-compression":"You can enable text compression in your web server configuration.","uses-responsive-images":"Upload images directly through the [media library](https://wordpress.org/support/article/media-library-screen/) to ensure that the required image sizes are available, and then insert them from the media library or use the image widget to ensure the optimal image sizes are used (including those for the responsive breakpoints). Avoid using `Full Size` images unless the dimensions are adequate for their usage. [Learn More](https://wordpress.org/support/article/inserting-images-into-posts-and-pages/).","server-response-time":"Choose a lightweight theme (ideally a block theme) and implement full-page caching or a static site solution. Disable unnecessary plugins to minimize server overhead. Consider upgrading your hosting to managed or dedicated service."}}],"entities":[{"name":"github.dev","origins":["https://friendly-engine-wvxrjrqxvpgpf9ppw-8080.app.github.dev"],"isFirstParty":true,"isUnrecognized":true},{"name":"WordPress","homepage":"https://wp.com/","origins":["https://s.w.org"],"category":"hosting"},{"name":"Gravatar","homepage":"https://en.gravatar.com/","origins":["https://secure.gravatar.com"],"category":"social"}],"fullPageScreenshot":{"screenshot":{"data":"data:image/webp;base64,UklGRiimAABXRUJQVlA4IBymAAAQ/AOdASo1Ay8JPxGIvFksKKalIdKJAYAiCWlu/DndDA4ANs/RWKFz1Ppf6o/4n+7/X/9cPBP8z/b/yA/fv278s/yr+H88f/s/0nji9P/qP289VP5j+Af6n+E/f/4rfw3/V/0Xiv8vvp72Bfb//s+/v5xPp/2q7o7hv9j/5P9N7Avud9o/Zzxtf+3/EepX6Z/jv/h/h/gB/ov9+/9Prr/1fB9/E/8f9vvgE/nf+N/ab3cv8f9wfQx9f+wn+yP/5+//4//dn++v/////xOfvEHFa6M7EUGtP7KmILzxycIzlyCzq2YqFMVV5C9NV9OE2RKmhO+vNbiRnlizhwGHvUDmAa2L5YC+NsaPkk/nZfbnm+4CP4trzvCia2mGmXndR09EYvnwj+Q9l4+bTTF8o9tzxVhFU+b5I7ZKLx24xzW4V0DjSKbDNYVWZjcNbADgJk4RGtjG9jnilcW0Zmko8yK8qQ9o8TG+oU5vDrq95DpgjtzzwDxY04lJaSHJ1vi9RjWZNzV/v7lG7QSxci33tsQC1uatCCZT76BDEyfh7mQl0fqCj4XwJtq/CkGE/lIHQcZYBFQdZmQDnfGMwOYauHxi95Ryi6vglDt1qh+HxheQNVhwnzJjtAR+pB0TKhdBISkCxjOcKC8Pu3JZeIXgCgH0cprFaTvgarrpgh7sY95Djig5HWMjlyjz9efrz9efrz9ef6j9efrz9efrz9efrz9ef6j9ef6pPVJ6pPVIqw1JNEg4bqqUML9tAYAgsemCPId2Me8h0wR5Duxj3ZGtVQ7ZOMk5j5UXfo5CvZ8BR59n9jWhhjLV5+8OKfWS5QGdXu0uDd5bolDxVpYlE6ooEn+FHgCxvkq5TtvGB3prQzuD95xT5WvZQK3cs1LoDJOf7AgBojq9OsxlGzr1fD42+BHKjp9g7ynapUcXnYS
